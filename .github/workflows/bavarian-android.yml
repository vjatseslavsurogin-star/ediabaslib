name: Bavarian Android build

on:
  push:
    branches: [bavarian-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bavarian-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify upstream build inputs
        run: |
          $project = Resolve-Path 'BmwDeepObd/BmwDeepObd.csproj'
          [xml]$xml = Get-Content $project -Raw
          $base = Split-Path $project
          $missing = @()
          foreach ($node in $xml.SelectNodes('//EmbeddedResource[@Include]')) {
            $include = $node.Include
            if ($include.Contains('$(') -or $node.Condition) { continue }
            $path = Join-Path $base $include
            if (-not (Test-Path -LiteralPath $path)) { $missing += $include }
          }
          $lines = @('## Upstream build inputs (USB baseline; PIC adapter updates disabled)')
          if (-not (Test-Path 'BmwDeepObd/Assets/Ecu.bin')) {
            $lines += '- ECU asset Ecu.bin is absent. See upstream BmwDeepObd/ReadMe.txt; diagnostic functionality cannot be validated without authorized ECU data.'
            Write-Warning 'ECU package absent; do not treat a compiled app as ready for vehicle diagnostics.'
          }
          foreach ($item in $missing) {
            $lines += "- Missing embedded resource: $item"
            Write-Host "::error::$item is missing from the source checkout"
          }
          if ($missing.Count -eq 0) { $lines += '- Required embedded resources found.' }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($missing.Count -gt 0) { throw 'Upstream embedded resources missing. Supply matching upstream build outputs; do not create dummy firmware.' }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install Android workload
        run: |
          dotnet --info
          dotnet workload install android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve Android SDK dependencies
        run: |
          dotnet build BmwDeepObd/BmwDeepObd.csproj -t:InstallAndroidDependencies -f net11.0-android37.2 "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME" -p:AcceptAndroidSDKLicenses=True -p:EnableAndroidTargets=true -p:BavarianUsbBaseline=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build original app (debug APK)
        run: |
          dotnet build BmwDeepObd/BmwDeepObd.csproj -c Debug -f net11.0-android37.2 -p:EnableAndroidTargets=true -p:BavarianUsbBaseline=true -p:AndroidPackageFormat=apk -p:AndroidPackageFormats=apk -p:EmbedAssembliesIntoApk=true -p:AndroidKeyStore=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $apk = Get-ChildItem BmwDeepObd/bin -Recurse -Filter '*-Signed.apk'
          if (-not $apk) { throw 'No signed debug APK produced.' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $apk | Copy-Item -Destination artifacts
          Get-FileHash artifacts/*.apk -Algorithm SHA256 | Format-Table | Out-String | Out-File artifacts/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bavarian-v16-service-history-template-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Collect APK signing utility for private packaging
        run: |
          $jar = Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Recurse -Filter apksigner.jar | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $jar) { throw 'Android apksigner.jar not found' }
          New-Item -ItemType Directory -Force private-tools | Out-Null
          Copy-Item $jar.FullName private-tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-signing-tool
          path: private-tools/apksigner.jar
          if-no-files-found: error
          retention-days: 7
